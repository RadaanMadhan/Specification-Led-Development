  <line x1="800" y1="405" x2="980" y2="455" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ========== LEFT BRANCH: Leon's Formal Verification ========== -->
  <rect x="40" y="460" width="600" height="640" rx="14" fill="#f7faf3" stroke="#5a6e3f" stroke-width="2.5"/>
  <text x="340" y="488" text-anchor="middle" font-size="17" font-weight="700" fill="#3d4a26">Formal Verification</text>
  <text x="340" y="507" text-anchor="middle" font-size="11" fill="#445" font-style="italic">"Does the spec satisfy its structural invariants?" — mathematical proof via Alloy SAT</text>

  <!-- patterns.md -->
  <rect x="60" y="525" width="220" height="80" rx="6" fill="#e3eed3" stroke="#5a6e3f" stroke-width="2"/>
  <text x="170" y="548" text-anchor="middle" font-size="12" font-weight="700">patterns.md</text>
  <text x="170" y="563" text-anchor="middle" font-size="10" fill="#445" font-style="italic">15 patterns (human-curated)</text>
  <text x="170" y="579" text-anchor="middle" font-size="9" fill="#555">LeastPrivilege · AppendOnly · AuditCompleteness</text>
  <text x="170" y="592" text-anchor="middle" font-size="9" fill="#555">OwnershipExclusivity · NoLeakage · …</text>

  <!-- LLM Lifter -->
  <rect x="320" y="525" width="300" height="80" rx="6" fill="#f3deb8" stroke="#a07a3a" stroke-width="2"/>
  <text x="470" y="548" text-anchor="middle" font-size="13" font-weight="700">LLM Lifter (Claude Opus)</text>
  <text x="470" y="565" text-anchor="middle" font-size="10" fill="#445">speceval/lifter_design.py</text>
  <text x="470" y="581" text-anchor="middle" font-size="10" fill="#445" font-style="italic">"translate, do not decide what to verify"</text>
  <text x="470" y="596" text-anchor="middle" font-size="10" fill="#445">→ feature_model.als + manifest.json</text>

  <!-- patterns + artefacts arrow into Lifter -->
  <line x1="280" y1="565" x2="320" y2="565" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Down to feature_model.als output -->
  <line x1="470" y1="605" x2="470" y2="635" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="340" y="635" width="260" height="42" rx="6" fill="#f8f0d4" stroke="#a07a3a" stroke-width="1.5"/>
