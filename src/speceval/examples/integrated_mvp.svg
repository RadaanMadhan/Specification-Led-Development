  <text x="340" y="982" text-anchor="middle" font-size="10" fill="#445">per-FR / per-pattern PASS · FAIL · counterexample</text>
  <text x="340" y="998" text-anchor="middle" font-size="10" fill="#445">+ mutation summary (non-vacuity verdicts)</text>
  <text x="340" y="1014" text-anchor="middle" font-size="10" font-weight="700" fill="#623813">banking demo: 24 / 26 PASS · 4 / 6 mutations bit</text>

