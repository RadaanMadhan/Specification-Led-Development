<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 970" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700">spec-led-eval — Phase 3 Design Verification Pipeline</text>
  <text x="500" y="65" text-anchor="middle" font-size="13" fill="#555" font-style="italic">Speckit artefacts → LLM-lifted Alloy → SAT verification + mutation testing</text>

  <!-- Speckit artefacts box -->
  <rect x="60" y="110" width="320" height="180" rx="10" fill="#dde7f0" stroke="#3a4d63" stroke-width="2"/>
  <text x="220" y="138" text-anchor="middle" font-size="15" font-weight="700">Speckit artefacts</text>
  <text x="220" y="156" text-anchor="middle" font-size="11" fill="#445" font-style="italic">generated by /speckit.specify .plan .tasks</text>
  <line x1="80" y1="170" x2="360" y2="170" stroke="#3a4d63" stroke-width="1"/>
  <text x="80" y="195" font-size="13" font-weight="600">• spec.md</text>
  <text x="100" y="213" font-size="11" fill="#555">user stories • FR-001..FR-016 • acceptance scenarios</text>
  <text x="80" y="234" font-size="13" font-weight="600">• data-model.md</text>
  <text x="100" y="252" font-size="11" fill="#555">entities • schema • UNIQUE / CHECK constraints</text>
  <text x="80" y="273" font-size="13" font-weight="600">• contracts/http-api.md</text>
  <text x="100" y="285" font-size="11" fill="#555">role × endpoint permission matrix</text>

  <!-- patterns.md box -->
  <rect x="620" y="110" width="320" height="180" rx="10" fill="#e3eed3" stroke="#5a6e3f" stroke-width="2"/>
  <text x="780" y="138" text-anchor="middle" font-size="15" font-weight="700">patterns.md</text>
  <text x="780" y="156" text-anchor="middle" font-size="11" fill="#445" font-style="italic">human-curated, evolves slowly</text>
  <line x1="640" y1="170" x2="920" y2="170" stroke="#5a6e3f" stroke-width="1"/>
  <text x="780" y="194" text-anchor="middle" font-size="12" font-weight="600">15 plain-English correctness patterns</text>
  <text x="780" y="214" text-anchor="middle" font-size="11" fill="#555">LeastPrivilege • PermissionCompleteness</text>
  <text x="780" y="230" text-anchor="middle" font-size="11" fill="#555">PrivilegeMonotonicity • AppendOnly</text>
  <text x="780" y="246" text-anchor="middle" font-size="11" fill="#555">AuditCompleteness • OwnershipExclusivity</text>
  <text x="780" y="262" text-anchor="middle" font-size="11" fill="#555">NoInformationLeakage • ConservationOfValue</text>
  <text x="780" y="278" text-anchor="middle" font-size="11" fill="#555">AttributionCorrectness • +6 more</text>

  <!-- Arrows from inputs to LLM lifter -->
  <line x1="240" y1="290" x2="380" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="290" x2="620" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LLM lifter box -->
  <rect x="320" y="370" width="360" height="130" rx="10" fill="#f3deb8" stroke="#a07a3a" stroke-width="2"/>
  <text x="500" y="396" text-anchor="middle" font-size="15" font-weight="700">LLM lifter</text>
  <text x="500" y="414" text-anchor="middle" font-size="12" fill="#444">Claude Opus  ·  speceval/lifter_design.py</text>
  <line x1="340" y1="426" x2="660" y2="426" stroke="#a07a3a" stroke-width="1"/>
  <text x="500" y="447" text-anchor="middle" font-size="11" font-style="italic" fill="#444">"translate; do not decide what to verify"</text>
  <text x="500" y="466" text-anchor="middle" font-size="11" fill="#444">emits Alloy domain (sigs/fields/facts)</text>
  <text x="500" y="481" text-anchor="middle" font-size="11" fill="#444">+ one assertion per applicable pattern</text>
  <text x="500" y="496" text-anchor="middle" font-size="11" fill="#444">+ one assertion per FR-NNN  (anchored inline)</text>

  <!-- Output: feature_model.als -->
  <line x1="500" y1="500" x2="500" y2="540" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="350" y="540" width="300" height="60" rx="6" fill="#f8f0d4" stroke="#a07a3a" stroke-width="1.5"/>
  <text x="500" y="563" text-anchor="middle" font-size="14" font-weight="600">feature_model.als</text>
  <text x="500" y="582" text-anchor="middle" font-size="10" fill="#555">+ manifest.json (mutation_targets, fr_assertion_map)</text>

  <!-- Arrow to validation -->
  <line x1="500" y1="600" x2="500" y2="650" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Human validation -->
  <rect x="320" y="650" width="360" height="60" rx="10" fill="#fbe6c4" stroke="#aa6f33" stroke-width="2"/>
  <text x="500" y="675" text-anchor="middle" font-size="14" font-weight="700">Human validation gate</text>
  <text x="500" y="695" text-anchor="middle" font-size="11" fill="#555">anchors match FRs? predicates non-tautological?</text>

  <!-- Split arrows -->
  <line x1="420" y1="710" x2="290" y2="765" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="710" x2="710" y2="765" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Mutation engine -->
  <rect x="60" y="765" width="420" height="100" rx="10" fill="#ead2db" stroke="#7a3e4f" stroke-width="2"/>
  <text x="270" y="790" text-anchor="middle" font-size="14" font-weight="700">Mutation engine</text>
  <text x="270" y="810" text-anchor="middle" font-size="11" fill="#444">clear named fact body  +  append inject_violation snippet</text>
  <text x="270" y="828" text-anchor="middle" font-size="11" fill="#444">→ mutated_F_*.als  (one per named fact)</text>
  <text x="270" y="850" text-anchor="middle" font-size="10" font-style="italic" fill="#555">non-vacuity check: assertion must FAIL on mutant</text>

  <!-- Alloy SAT solver -->
  <rect x="520" y="765" width="420" height="100" rx="10" fill="#e0d4ec" stroke="#553f76" stroke-width="2"/>
  <text x="730" y="790" text-anchor="middle" font-size="14" font-weight="700">Alloy SAT solver</text>
  <text x="730" y="810" text-anchor="middle" font-size="11" fill="#444">speceval/runner.py · run_alloy_file()</text>
  <text x="730" y="828" text-anchor="middle" font-size="11" fill="#444">verdict per assertion: UNSAT = PASS, SAT = FAIL</text>
  <text x="730" y="850" text-anchor="middle" font-size="10" font-style="italic" fill="#555">mathematical proof within scope · no AI in this step</text>

  <!-- Arrows down to reporter -->
  <line x1="270" y1="865" x2="430" y2="900" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="865" x2="570" y2="900" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Reporter / output -->
  <rect x="260" y="900" width="480" height="60" rx="10" fill="#fae8d4" stroke="#a05d22" stroke-width="2"/>
  <text x="500" y="922" text-anchor="middle" font-size="14" font-weight="700">Reporter → report.txt</text>
  <text x="500" y="941" text-anchor="middle" font-size="11" fill="#444">compliance matrix · per-FR coverage · mutation summary</text>
  <text x="500" y="956" text-anchor="middle" font-size="11" font-weight="600" fill="#623813">banking demo (002-bank-transfer-audit): 24/26 PASS · 4/6 mutations bit</text>

</svg>
