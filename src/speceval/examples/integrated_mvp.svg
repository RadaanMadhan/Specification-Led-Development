  <text x="650" y="62" text-anchor="middle" font-size="13" fill="#555" font-style="italic">
    Formal verification (Alloy) + WAF-derived KPIs (Azure AI Search) — two complementary approaches over one set of Speckit artefacts
  </text>

  <!-- Natural Language -->
  <rect x="550" y="95" width="200" height="60" rx="8" fill="#e8e8e8" stroke="#444" stroke-width="2"/>
  <text x="650" y="128" text-anchor="middle" font-size="14" font-weight="700">Natural Language</text>
  <text x="650" y="144" text-anchor="middle" font-size="10" fill="#555">(business requirement)</text>

  <line x1="650" y1="155" x2="650" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Speckit -->
  <rect x="520" y="195" width="260" height="80" rx="10" fill="#cfe2f3" stroke="#3a4d63" stroke-width="2"/>
  <text x="650" y="222" text-anchor="middle" font-size="16" font-weight="700">Speckit</text>
  <text x="650" y="241" text-anchor="middle" font-size="11" fill="#445">/speckit-specify · /speckit-plan · /speckit-tasks</text>
  <text x="650" y="259" text-anchor="middle" font-size="10" fill="#666" font-style="italic">(GitHub Spec-Kit, driven from Claude Code)</text>

  <line x1="650" y1="275" x2="650" y2="305" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Speckit artefacts bundle -->
