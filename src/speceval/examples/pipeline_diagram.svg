<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">
  <title>spec-led-eval pipeline</title>
  <desc>How a SpecKit spec.md becomes mathematically verified KPI verdicts. Claude Opus translates English prose into canonical Alloy atoms, then Alloy's SAT solver checks the result against three hand-written KPI predicates. The LLM does only translation; verdicts come from formal mathematical reasoning.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c47a1a"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">spec-led-eval — how a SpecKit spec becomes a verified KPI report</text>
  <text x="640" y="76" text-anchor="middle" font-size="14" fill="#555">The LLM translates English to Alloy. Alloy's SAT solver does the mathematical checking.</text>

  <rect x="50" y="270" width="660" height="240" rx="16" fill="#dceeff" stroke="#5a8fd1" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.55"/>
  <text x="380" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#234f87" letter-spacing="2">LLM TRANSLATION ZONE</text>

  <rect x="780" y="270" width="450" height="240" rx="16" fill="#daf2dd" stroke="#3da359" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.55"/>
  <text x="1005" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5b30" letter-spacing="2">FORMAL VERIFICATION ZONE</text>

  <rect x="850" y="115" width="310" height="100" rx="10" fill="#fff5e1" stroke="#c47a1a" stroke-width="2"/>
  <text x="1005" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4d11">Hand-written by us</text>
  <text x="868" y="163" font-size="12" fill="#3a3a3a">- alloy/domain.als - generic sigs</text>
  <text x="868" y="183" font-size="12" fill="#3a3a3a">- alloy/kpi_library.als - 3 KPIs</text>
  <text x="868" y="203" font-size="11" fill="#7a4d11" font-style="italic">(predicates and assertions)</text>

  <path d="M 1005 215 L 1005 372" stroke="#c47a1a" stroke-width="2" fill="none" marker-end="url(#arrow-orange)" stroke-dasharray="4 3"/>

  <rect x="60" y="340" width="140" height="100" rx="10" fill="#ffffff" stroke="#444" stroke-width="2"/>
  <text x="130" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">spec.md</text>
  <text x="130" y="385" text-anchor="middle" font-size="11" fill="#555">SpecKit output</text>
  <text x="130" y="405" text-anchor="middle" font-size="10" fill="#666" font-style="italic">**Given** ... **When** ...</text>
  <text x="130" y="420" text-anchor="middle" font-size="10" fill="#666" font-style="italic">**Then** ...</text>

  <path d="M 200 390 L 235 390" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="240" y="340" width="130" height="100" rx="10" fill="#ffffff" stroke="#444" stroke-width="2"/>
  <text x="305" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Parser</text>
  <text x="305" y="385" text-anchor="middle" font-size="11" fill="#555">Python regex</text>
  <text x="305" y="408" text-anchor="middle" font-size="10" fill="#666">deterministic</text>
  <text x="305" y="423" text-anchor="middle" font-size="10" fill="#666">no AI</text>

  <path d="M 370 390 L 405 390" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="410" y="320" width="200" height="140" rx="10" fill="#ffffff" stroke="#234f87" stroke-width="2.5"/>
  <text x="510" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#234f87">Claude Opus</text>
  <text x="510" y="362" text-anchor="middle" font-size="11" fill="#234f87">claude-opus-4-6</text>
  <line x1="430" y1="372" x2="590" y2="372" stroke="#234f87" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.6"/>
  <text x="510" y="389" text-anchor="middle" font-size="11" fill="#1a1a1a">two passes:</text>
  <text x="510" y="406" text-anchor="middle" font-size="11" fill="#1a1a1a">1. extraction</text>
  <text x="510" y="423" text-anchor="middle" font-size="11" fill="#1a1a1a">2. self-validation</text>
  <text x="510" y="448" text-anchor="middle" font-size="10" fill="#666" font-style="italic">English to Alloy atoms</text>

  <path d="M 610 390 L 645 390" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="650" y="340" width="130" height="100" rx="10" fill="#ffffff" stroke="#444" stroke-width="2"/>
  <text x="715" y="365" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">snapshot.als</text>
  <text x="715" y="385" text-anchor="middle" font-size="11" fill="#555">auto-generated</text>
  <text x="715" y="408" text-anchor="middle" font-size="10" fill="#666" font-style="italic">one sig Scenario_X</text>
  <text x="715" y="423" text-anchor="middle" font-size="10" fill="#666" font-style="italic">extends Scenario {...}</text>

  <path d="M 780 390 L 875 390" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="880" y="320" width="170" height="140" rx="10" fill="#ffffff" stroke="#1d5b30" stroke-width="2.5"/>
  <text x="965" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5b30">Alloy SAT solver</text>
  <text x="965" y="362" text-anchor="middle" font-size="11" fill="#1d5b30">no AI involved</text>
  <line x1="900" y1="372" x2="1030" y2="372" stroke="#1d5b30" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.6"/>
  <text x="965" y="392" text-anchor="middle" font-size="11" fill="#1a1a1a">exhaustive search</text>
  <text x="965" y="408" text-anchor="middle" font-size="11" fill="#1a1a1a">for counterexamples</text>
  <text x="965" y="432" text-anchor="middle" font-size="10" fill="#666" font-style="italic">UNSAT to PASS</text>
  <text x="965" y="448" text-anchor="middle" font-size="10" fill="#666" font-style="italic">SAT to FAIL</text>

  <path d="M 1050 390 L 1085 390" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <rect x="1090" y="340" width="130" height="100" rx="10" fill="#ffffff" stroke="#1d5b30" stroke-width="2"/>
  <text x="1155" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Report</text>
  <text x="1102" y="385" font-size="11" fill="#1d5b30">KPI_G_001 PASS</text>
  <text x="1102" y="402" font-size="11" fill="#1d5b30">KPI_G_002 PASS</text>
  <text x="1102" y="419" font-size="11" fill="#1d5b30">KPI_G_003 PASS</text>

  <rect x="50" y="555" width="1180" height="120" rx="10" fill="#fafafa" stroke="#dadada" stroke-width="1"/>

  <text x="70" y="582" font-size="13" font-weight="700" fill="#1a1a1a">What does what:</text>

  <circle cx="80" cy="608" r="6" fill="#5a8fd1"/>
  <text x="95" y="612" font-size="12" fill="#1a1a1a">LLM zone - Claude Opus translates the spec's English prose into canonical Alloy atoms (states, actions, scenario triples).</text>

  <circle cx="80" cy="630" r="6" fill="#3da359"/>
  <text x="95" y="634" font-size="12" fill="#1a1a1a">Alloy zone - pure mathematical reasoning. The SAT solver searches for any structure that violates a KPI; no AI involvement at all.</text>

  <rect x="74" y="646" width="12" height="12" fill="#fff5e1" stroke="#c47a1a" stroke-width="1.5"/>
  <text x="95" y="657" font-size="12" fill="#1a1a1a">Hand-written by us - the generic Alloy domain plus three KPI predicates. Stable across all SpecKit projects.</text>

  <text x="640" y="700" text-anchor="middle" font-size="12" fill="#666" font-style="italic">PASS verdicts are mathematical results, not AI opinions.</text>
</svg>
