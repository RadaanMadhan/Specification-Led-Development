[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speceval"
version = "0.1.0"
description = "Specification-led evaluation: lift SpecKit spec.md to Alloy and check generic KPIs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Leon Hausmann" }]
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
nice = ["rich>=13.0"]   # optional: prettier terminal output

[project.scripts]
speceval = "speceval.cli:main"

[tool.setuptools.packages.find]
include = ["speceval*"]
