  <text x="650" y="1168" text-anchor="middle" font-size="16" font-weight="700">Unified Compliance / KPI Report</text>
  <text x="650" y="1188" text-anchor="middle" font-size="11" fill="#333">structural verdicts (Alloy) + measurable targets (WAF) — per-FR traceability</text>
  <text x="650" y="1206" text-anchor="middle" font-size="10" fill="#555" font-style="italic">"the spec is structurally sound AND the running system can be measured against these WAF-grounded numbers"</text>

  <!-- Revisions arrow (red dotted) — from unified report back to Natural Language -->
  <path d="M 350 1180 Q 60 1180, 60 700 Q 60 130, 545 130" stroke="#c33" stroke-width="2.5" stroke-dasharray="8,5" fill="none" marker-end="url(#arrowred)"/>
  <text x="78" y="700" font-size="13" fill="#c33" font-weight="700" font-style="italic" transform="rotate(-90, 78, 700)">revisions</text>

