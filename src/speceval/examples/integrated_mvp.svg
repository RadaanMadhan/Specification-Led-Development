  <text x="650" y="328" text-anchor="middle" font-size="14" font-weight="700">Speckit artefacts (per feature)</text>
  <line x1="290" y1="338" x2="1010" y2="338" stroke="#666" stroke-width="1"/>

  <rect x="290" y="350" width="170" height="45" rx="6" fill="#fff" stroke="#666" stroke-width="1"/>
  <text x="375" y="368" text-anchor="middle" font-size="11" font-weight="600">spec.md</text>
  <text x="375" y="384" text-anchor="middle" font-size="9" fill="#666">FRs · scenarios · SCs</text>

  <rect x="470" y="350" width="170" height="45" rx="6" fill="#fff" stroke="#666" stroke-width="1"/>
  <text x="555" y="368" text-anchor="middle" font-size="11" font-weight="600">plan.md</text>
  <text x="555" y="384" text-anchor="middle" font-size="9" fill="#666">tech context · gates</text>

  <rect x="650" y="350" width="170" height="45" rx="6" fill="#fff" stroke="#666" stroke-width="1"/>
  <text x="735" y="368" text-anchor="middle" font-size="11" font-weight="600">data-model.md</text>
  <text x="735" y="384" text-anchor="middle" font-size="9" fill="#666">entities · schema</text>

  <rect x="830" y="350" width="170" height="45" rx="6" fill="#fff" stroke="#666" stroke-width="1"/>
  <text x="915" y="368" text-anchor="middle" font-size="11" font-weight="600">contracts/http-api.md</text>
  <text x="915" y="384" text-anchor="middle" font-size="9" fill="#666">role × endpoint matrix</text>

  <!-- Branching arrows from artefact bundle -->
