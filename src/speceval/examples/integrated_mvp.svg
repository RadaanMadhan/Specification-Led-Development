  <text x="970" y="994" text-anchor="middle" font-size="10" fill="#445">+ measurement method per row (load test · Azure Monitor · drill)</text>
  <text x="970" y="1011" text-anchor="middle" font-size="10" font-weight="700" fill="#623813">3 sample chains derived · 5 KPI rows (banking-style probe)</text>

  <!-- Down arrow to unified -->
