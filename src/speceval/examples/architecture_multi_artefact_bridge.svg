<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">
  <title>The smart bridge - multi-artefact lift into a shared Alloy world</title>
  <desc>Architecture showing four SpecKit artefacts (spec.md, plan.md, generated code, runtime trace) each lifted by their own adapter into a single shared Alloy world (containing the generic domain and the KPI library), producing a compliance matrix with pass/fail per KPI per artefact. The key insight is that everything translates UP to the same formal world so the same KPI library checks all artefacts uniformly and drift between them surfaces as disagreement in the matrix.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5b30"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>

  <text x="640" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">The smart bridge - lift every SpecKit artefact up to one shared Alloy world</text>
  <text x="640" y="68" text-anchor="middle" font-size="13" fill="#555">Don't translate Alloy down to code. Translate every artefact UP to Alloy. Same domain, same KPI library, drift detected for free.</text>

  <rect x="50" y="100" width="560" height="510" rx="16" fill="#dceeff" stroke="#5a8fd1" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.45"/>
  <text x="330" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#234f87" letter-spacing="2">PER-ARTEFACT TRANSLATION</text>

  <rect x="640" y="100" width="280" height="320" rx="16" fill="#daf2dd" stroke="#3da359" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="780" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1d5b30" letter-spacing="2">SHARED ALLOY WORLD</text>

  <rect x="950" y="100" width="290" height="320" rx="16" fill="#fff5e1" stroke="#c47a1a" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="1095" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#7a4d11" letter-spacing="2">COMPLIANCE OUTPUT</text>

  <rect x="62" y="160" width="135" height="56" rx="8" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="129" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">SpecKit spec.md</text>
  <text x="129" y="202" text-anchor="middle" font-size="10" fill="#666">acceptance scenarios</text>
  <path d="M 197 188 L 232 188" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="237" y="160" width="200" height="56" rx="8" fill="#ffffff" stroke="#234f87" stroke-width="2"/>
  <text x="337" y="184" text-anchor="middle" font-size="13" font-weight="700" fill="#234f87">Adapter A: spec lifter</text>
  <text x="337" y="202" text-anchor="middle" font-size="10" fill="#234f87">LLM extraction + validation</text>

  <rect x="62" y="240" width="135" height="56" rx="8" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="129" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">SpecKit plan.md</text>
  <text x="129" y="282" text-anchor="middle" font-size="10" fill="#666">data model and tables</text>
  <path d="M 197 268 L 232 268" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="237" y="240" width="200" height="56" rx="8" fill="#ffffff" stroke="#234f87" stroke-width="2"/>
  <text x="337" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#234f87">Adapter B: plan lifter</text>
  <text x="337" y="282" text-anchor="middle" font-size="10" fill="#234f87">markdown table parser</text>

  <rect x="62" y="320" width="135" height="56" rx="8" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="129" y="344" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Generated code</text>
  <text x="129" y="362" text-anchor="middle" font-size="10" fill="#666">Python / TS source</text>
  <path d="M 197 348 L 232 348" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="237" y="320" width="200" height="56" rx="8" fill="#ffffff" stroke="#234f87" stroke-width="2"/>
  <text x="337" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#234f87">Adapter C: AST lifter</text>
  <text x="337" y="362" text-anchor="middle" font-size="10" fill="#234f87">parse syntax tree</text>

  <rect x="62" y="400" width="135" height="56" rx="8" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="129" y="424" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Runtime trace</text>
  <text x="129" y="442" text-anchor="middle" font-size="10" fill="#666">events.jsonl logs</text>
  <path d="M 197 428 L 232 428" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <rect x="237" y="400" width="200" height="56" rx="8" fill="#ffffff" stroke="#234f87" stroke-width="2"/>
  <text x="337" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#234f87">Adapter D: trace lifter</text>
  <text x="337" y="442" text-anchor="middle" font-size="10" fill="#234f87">log to concrete atoms</text>

  <path d="M 437 188 Q 530 188 645 220" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 437 268 Q 540 268 645 248" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 437 348 Q 540 348 645 278" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 437 428 Q 530 428 645 308" stroke="#444" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="660" y="160" width="240" height="240" rx="12" fill="#ffffff" stroke="#1d5b30" stroke-width="2.5"/>
  <text x="780" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5b30">Hand-written, stable</text>

  <rect x="678" y="208" width="204" height="64" rx="6" fill="#f0faf2" stroke="#1d5b30" stroke-width="1"/>
  <text x="780" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#1d5b30">domain.als</text>
  <text x="780" y="246" text-anchor="middle" font-size="11" fill="#1a1a1a">State, Action, Scenario</text>
  <text x="780" y="262" text-anchor="middle" font-size="11" fill="#1a1a1a">Story, Requirement, Initial</text>

  <rect x="678" y="284" width="204" height="98" rx="6" fill="#f0faf2" stroke="#1d5b30" stroke-width="1"/>
  <text x="780" y="304" text-anchor="middle" font-size="13" font-weight="700" fill="#1d5b30">kpi_library.als</text>
  <text x="780" y="324" text-anchor="middle" font-size="11" fill="#1a1a1a">KPI-G-001 Determinism</text>
  <text x="780" y="342" text-anchor="middle" font-size="11" fill="#1a1a1a">KPI-G-002 Story Coverage</text>
  <text x="780" y="360" text-anchor="middle" font-size="11" fill="#1a1a1a">KPI-G-003 Uniqueness</text>
  <text x="780" y="378" text-anchor="middle" font-size="10" fill="#666" font-style="italic">...and more</text>

  <path d="M 902 280 L 962 280" stroke="#1d5b30" stroke-width="2.5" fill="none" marker-end="url(#arr-green)"/>
  <text x="932" y="270" text-anchor="middle" font-size="10" fill="#1d5b30" font-style="italic">Alloy SAT</text>

  <rect x="970" y="160" width="260" height="240" rx="12" fill="#ffffff" stroke="#c47a1a" stroke-width="2.5"/>
  <text x="1100" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4d11">Compliance Matrix</text>
  <text x="1100" y="208" text-anchor="middle" font-size="10" fill="#7a4d11">pass/fail per KPI per artefact</text>

  <g font-size="11" fill="#1a1a1a">
    <text x="1015" y="240" font-weight="700">KPI</text>
    <text x="1075" y="240" font-weight="700" text-anchor="middle">Spec</text>
    <text x="1125" y="240" font-weight="700" text-anchor="middle">Plan</text>
    <text x="1170" y="240" font-weight="700" text-anchor="middle">Code</text>
    <text x="1215" y="240" font-weight="700" text-anchor="middle">Trace</text>
    <line x1="990" y1="248" x2="1215" y2="248" stroke="#c47a1a" stroke-width="0.8"/>

    <text x="985" y="270">K-001</text>
    <text x="1075" y="270" text-anchor="middle" fill="#1d5b30" font-size="14" font-weight="700">PASS</text>
    <text x="1125" y="270" text-anchor="middle" fill="#1d5b30" font-size="14" font-weight="700">PASS</text>
    <text x="1170" y="270" text-anchor="middle" fill="#1d5b30" font-size="14" font-weight="700">PASS</text>
    <text x="1215" y="270" text-anchor="middle" fill="#1d5b30" font-size="14" font-weight="700">PASS</text>

    <text x="985" y="297">K-002</text>
    <text x="1075" y="297" text-anchor="middle" fill="#1d5b30" font-size="14" font-weight="700">PASS</text>
    <text x="1125" y="297" text-anchor="middle" fill="#b22222" font-size="14" font-weight="700">FAIL</text>
    <text x="1170" y="297" text-anchor="middle" fill="#b22222" font-size="14" font-weight="700">FAIL</text>
    <text x="1215" y="297" text-anchor="middle" fill="#1d5b30" font-size="14" font-weight="700">PASS</text>

    <text x="985" y="324">K-003</text>
    <text x="1075" y="324" text-anchor="middle" fill="#1d5b30" font-size="14" font-weight="700">PASS</text>
    <text x="1125" y="324" text-anchor="middle" fill="#1d5b30" font-size="14" font-weight="700">PASS</text>
    <text x="1170" y="324" text-anchor="middle" fill="#1d5b30" font-size="14" font-weight="700">PASS</text>
    <text x="1215" y="324" text-anchor="middle" fill="#b22222" font-size="14" font-weight="700">FAIL</text>
  </g>

  <text x="1100" y="356" text-anchor="middle" font-size="10" fill="#7a4d11" font-style="italic">drift between artefacts shows up</text>
  <text x="1100" y="370" text-anchor="middle" font-size="10" fill="#7a4d11" font-style="italic">as disagreement in a row</text>
  <text x="1100" y="386" text-anchor="middle" font-size="10" fill="#b22222">e.g. K-002: spec promises it, plan and code lost it</text>

  <rect x="50" y="640" width="1180" height="65" rx="10" fill="#fafafa" stroke="#dadada" stroke-width="1"/>
  <text x="70" y="664" font-size="13" font-weight="700" fill="#1a1a1a">Why this is the smart bridge:</text>
  <text x="70" y="685" font-size="12" fill="#1a1a1a">One generic Alloy world serves every artefact. The same KPI library checks the spec, the plan, the code, and the runtime - all against</text>
  <text x="70" y="699" font-size="12" fill="#1a1a1a">the same definitions. When two artefacts disagree on a KPI, you know where in the SpecKit pipeline meaning was lost. That is traceability and drift detection in one mechanism.</text>
</svg>
