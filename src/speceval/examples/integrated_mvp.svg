  <text x="1105" y="585" text-anchor="middle" font-size="10" fill="#445">kpi_agent.py</text>
  <text x="1105" y="601" text-anchor="middle" font-size="10" fill="#445">OpenAI gpt-4o-mini</text>
  <text x="1105" y="616" text-anchor="middle" font-size="9" fill="#666" font-style="italic">cosine sim. → top-3 WAF refs</text>

