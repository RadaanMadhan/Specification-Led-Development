  <rect x="60" y="803" width="280" height="100" rx="6" fill="#ead2db" stroke="#7a3e4f" stroke-width="2"/>
  <text x="200" y="826" text-anchor="middle" font-size="13" font-weight="700">Mutation Engine</text>
  <text x="200" y="843" text-anchor="middle" font-size="10" fill="#445">clear named fact + inject_violation</text>
  <text x="200" y="858" text-anchor="middle" font-size="10" fill="#445">→ mutated_F_*.als (one per fact)</text>
  <text x="200" y="876" text-anchor="middle" font-size="10" fill="#666" font-style="italic">non-vacuity check:</text>
  <text x="200" y="890" text-anchor="middle" font-size="10" fill="#666" font-style="italic">assertion must FAIL on mutant</text>

  <!-- Alloy SAT Solver -->
  <rect x="370" y="803" width="250" height="100" rx="6" fill="#e0d4ec" stroke="#553f76" stroke-width="2"/>
  <text x="495" y="826" text-anchor="middle" font-size="13" font-weight="700">Alloy SAT Solver</text>
  <text x="495" y="843" text-anchor="middle" font-size="10" fill="#445">speceval/runner.py</text>
  <text x="495" y="860" text-anchor="middle" font-size="10" fill="#445">UNSAT = PASS · SAT = FAIL</text>
  <text x="495" y="878" text-anchor="middle" font-size="10" fill="#666" font-style="italic">mathematical proof in scope 5</text>
  <text x="495" y="892" text-anchor="middle" font-size="10" fill="#666" font-style="italic">(no AI in this step)</text>

  <!-- Down to Leon's report -->
